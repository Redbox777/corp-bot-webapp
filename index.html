<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Корпорация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #1a1a2e; --card: rgba(255,255,255,0.08); --primary: #667eea; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #fff; min-height: 100vh; padding: 16px; overflow-x: hidden; }
        
        .header { text-align: center; margin-bottom: 16px; }
        .title { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        
        .balance-card { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3); position: relative; overflow: hidden; }
        .balance-label { font-size: 12px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 42px; font-weight: 900; margin: 8px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .stats-row { display: flex; justify-content: space-around; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
        .stat-item { text-align: center; }
        .stat-val { font-size: 16px; font-weight: 700; }
        .stat-label { font-size: 11px; opacity: 0.6; margin-top: 2px; }
        
        .click-area { margin: 20px 0; display: flex; justify-content: center; }
        .click-btn { 
            width: 160px; height: 160px; border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe); 
            border: none; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer; position: relative; overflow: hidden;
        }
        .click-btn:active { transform: scale(0.92); }
        .click-icon { font-size: 48px; margin-bottom: 4px; }
        .click-text { font-size: 14px; font-weight: 700; color: #003; }
        
        .power-info { text-align: center; margin-top: 12px; font-size: 13px; opacity: 0.7; }
        
        .tabs { display: flex; background: var(--card); border-radius: 16px; padding: 4px; margin-bottom: 16px; }
        .tab { flex: 1; padding: 10px; border: none; background: transparent; color: #fff; border-radius: 12px; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .tab.active { background: rgba(255,255,255,0.15); }
        
        .list-item { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .item-left { display: flex; align-items: center; gap: 12px; }
        .item-icon { font-size: 24px; width: 40px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .item-name { font-weight: 600; font-size: 15px; }
        .item-desc { font-size: 11px; opacity: 0.6; margin-top: 2px; }
        .btn-buy { background: #38ef7d; color: #000; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 13px; }
        .btn-buy:disabled { background: #444; color: #888; }
        
        .ref-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #f093fb, #f5576c); border: none; border-radius: 14px; color: #fff; font-weight: 700; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">💼 CORPORATION</div>
    </div>

    <div class="balance-card">
        <div class="balance-label">Total Balance</div>
        <div class="balance-value" id="balance">0$</div>
        <div class="stats-row">
            <div class="stat-item">
                <div class="stat-val" id="level">1</div>
                <div class="stat-label">LVL</div>
            </div>
            <div class="stat-item">
                <div class="stat-val" id="income">+0</div>
                <div class="stat-label">/SEC</div>
            </div>
        </div>
    </div>

    <div class="click-area">
        <button class="click-btn" id="clickBtn">
            <div class="click-icon">👆</div>
            <div class="click-text">TAP</div>
        </button>
    </div>
    <div class="power-info" id="powerInfo">Power: +10$ per click</div>

    <button class="ref-btn" onclick="shareRef()"> Invite Friends (+500$)</button>

    <div class="tabs" style="margin-top: 20px;">
        <button class="tab active" onclick="switchTab('upgrades')">🚀 Upgrades</button>
        <button class="tab" onclick="switchTab('leaderboard')">🏆 Top</button>
    </div>

    <div id="upgrades-tab"></div>
    <div id="leaderboard-tab" style="display:none"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();
        const userId = tg.initDataUnsafe?.user?.id || 'test';
        let data = {};

        async function api(p, m='GET') { return (await fetch(`/api${p}`, {method:m})).json(); }

        async function load() {
            data = await api(`/player/${userId}`);
            render();
        }

        function render() {
            document.getElementById('balance').innerText = data.balance + '$';
            document.getElementById('level').innerText = data.level;
            document.getElementById('income').innerText = '+' + (data.passive_income||0);
            document.getElementById('powerInfo').innerText = `Power: +${data.click_power||10}$ per click`;
            renderShop();
        }

        document.getElementById('clickBtn').onclick = async () => {
            const btn = document.getElementById('clickBtn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = 'scale(1)', 100);
            data = await api(`/click/${userId}`, 'POST');
            render();
        };

        async function renderShop() {
            const shop = await api('/shop');
            const el = document.getElementById('upgrades-tab');
            let html = '';
            for(let [k, v] of Object.entries(shop)) {
                const count = (data.upgrades||{})[k] || 0;
                const price = Math.floor(v.cost * Math.pow(1.15, count));
                const typeLabel = v.type === 'click' ? `+${v.power} click` : `+${v.income} sec`;
                html += `<div class="list-item">
                    <div class="item-left">
                        <div class="item-icon">${v.icon}</div>
                        <div>
                            <div class="item-name">${v.name}</div>
                            <div class="item-desc">${typeLabel} | Owned: ${count}</div>
                        </div>
                    </div>
                    <button class="btn-buy" onclick="buy('${k}', ${price})" ${data.balance < price ? 'disabled' : ''}>${price}$</button>
                </div>`;
            }
            el.innerHTML = html;
        }

        async function buy(id, price) {
            if(data.balance < price) return;
            const res = await api(`/buy/${userId}/${id}`, 'POST');
            if(res.success) { data = {...data, ...res}; render(); }
            else tg.showAlert(res.error);
        }

        function shareRef() {
            api(`/referral_link/${userId}?bot=MagnatZeroBot`).then(d => {
                tg.openTelegramLink(d.link);
            });
        }

        function switchTab(t) {
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('upgrades-tab').style.display = t === 'upgrades' ? 'block' : 'none';
            document.getElementById('leaderboard-tab').style.display = t === 'leaderboard' ? 'block' : 'none';
            if(t === 'leaderboard') loadTop();
        }

        async function loadTop() {
            const top = await api('/leaderboard');
            document.getElementById('leaderboard-tab').innerHTML = top.map((p, i) => `
                <div class="list-item" style="${p.chat_id==userId?'border:1px solid #667eea':''}">
                    <div class="item-left">
                        <div class="item-icon" style="background:${i<3?'gold':'#333'};color:${i<3?'#000':'#fff'}">#${p.rank}</div>
                        <div class="item-name">Player #${p.chat_id}</div>
                    </div>
                    <div style="font-weight:bold">${p.balance}$</div>
                </div>
            `).join('');
        }

        load();
        setInterval(() => {
            if(data.passive_income > 0) { data.balance += data.passive_income; render(); }
        }, 1000);
    </script>
</body>
</html>
