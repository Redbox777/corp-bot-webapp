<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Corp Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --green: #10b981; --gold: #f59e0b; --gem: #8b5cf6; --red: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: #fff; min-height: 100vh; padding: 16px; overflow: hidden; }
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99; will-change: transform; }
        .event-banner { padding: 8px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 10px; display: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        .header { text-align: center; margin-bottom: 12px; position: relative; z-index: 10; }
        .balance-box { background: linear-gradient(135deg, #1e3a8a, #3b82f6); border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 8px 24px rgba(59,130,246,0.3); position: relative; margin-bottom: 16px; }
        .gem-badge { position: absolute; top: -10px; right: -10px; background: var(--gem); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; box-shadow: 0 4px 10px rgba(139,92,246,0.5); display: flex; align-items: center; gap: 4px; }
        .bal-label { font-size: 12px; opacity: 0.8; text-transform: uppercase; }
        .bal-val { font-size: 38px; font-weight: 900; margin: 6px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.3); transition: transform 0.1s; }
        .mult-text { font-size: 12px; color: var(--gem); font-weight: bold; margin-top: 4px; }
        .lvl-bar { height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; margin-top: 12px; overflow: hidden; }
        .lvl-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.2s; }
        .lvl-text { font-size: 11px; margin-top: 4px; opacity: 0.7; }
        .click-area { display: flex; justify-content: center; margin: 10px 0; position: relative; z-index: 10; }
        .click-btn { 
            width: 150px; height: 150px; border-radius: 50%; 
            background: radial-gradient(circle, #60a5fa, #2563eb); 
            border: 4px solid #93c5fd; margin: 0 auto; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 0 30px rgba(37,99,235,0.4); 
            transition: transform 0.05s cubic-bezier(0.4,0,0.2,1); 
            cursor: pointer; position: relative; overflow: hidden; 
            will-change: transform; -webkit-tap-highlight-color: transparent;
        }
        .click-btn:active, .click-btn.pressed { transform: scale(0.92); }
        .click-inner { text-align: center; pointer-events: none; }
        .click-icon { font-size: 50px; }
        .click-pwr { font-size: 16px; font-weight: 800; margin-top: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .tabs { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin: 16px 0; overflow-x: auto; position: relative; z-index: 10; }
        .tab { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; border-radius: 10px; font-weight: 600; font-size: 13px; white-space: nowrap; text-align: center; transition: 0.2s; }
        .tab.active { background: #334155; color: #fff; }
        .tab-boss { background: rgba(239, 68, 68, 0.15); color: var(--red); }
        .tab-boss.active { background: var(--red); color: #fff; }
        .list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; overflow-y: auto; height: calc(100vh - 380px); position: relative; z-index: 10; padding-right: 4px; }
        .card { background: var(--card); border-radius: 14px; padding: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .card-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .icon { width: 42px; height: 42px; min-width: 42px; background: #334155; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .name { font-weight: 600; font-size: 15px; }
        .desc { font-size: 12px; color: #94a3b8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prog-wrap { width: 100%; height: 4px; background: #334155; border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .prog-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
        .btn { border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; margin-left: 8px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-buy { background: var(--green); color: #000; }
        .btn-claim { background: var(--gold); color: #000; }
        .btn-rebirth { background: var(--gem); color: #fff; width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; border-radius: 12px; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; opacity: 0.7; }
        .prestige-card, .boss-card { border: 2px solid; background: rgba(255,255,255,0.1); flex-direction: column; text-align: center; gap: 12px; }
        .hidden { display: none; }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        .shake { animation: shake 0.4s; }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div id="eventBanner" class="event-banner"></div>
    
    <div class="header">
        <div class="balance-box">
            <div class="gem-badge">💎 <span id="gems">0</span></div>
            <div class="bal-label">Баланс</div>
            <div class="bal-val" id="bal">0$</div>
            <div class="mult-text">x<span id="mult">1.0</span> Bonus</div>
            <div class="lvl-bar"><div class="lvl-fill" id="lvlFill"></div></div>
            <div class="lvl-text" id="lvlTxt">Уровень 1 (0/100)</div>
        </div>
    </div>

    <div class="click-area">
        <button class="click-btn" id="cBtn"><div class="click-inner"><div class="click-icon">👆</div><div class="click-pwr" id="pwrTxt">+10$/клик</div></div></button>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('upgrades', this)"> Магазин</button>
        <button class="tab" onclick="switchTab('achievements', this)">🏆 Достижения</button>
        <button class="tab tab-boss" onclick="switchTab('boss', this)">👹 Босс</button>
        <button class="tab" onclick="switchTab('rebirth', this)">💎 Перерождение</button>
        <button class="tab" onclick="switchTab('top', this)"> Топ</button>
    </div>

    <div id="upgrades" class="list"></div>
    <div id="achievements" class="list hidden"></div>
    <div id="boss" class="list hidden">
        <div class="card boss-card" style="border-color: var(--red);">
            <div style="font-size: 70px;" id="boss-icon">🐉</div>
            <div class="name" style="color: var(--red); font-size: 22px;" id="boss-name">Огненный Дракон</div>
            <div class="desc" style="text-align:center; font-size: 14px; color: #fff;">Уровень <span id="boss-lvl">1</span></div>
            <div class="prog-wrap" style="height: 10px; margin-top: 15px; width: 100%; border-radius: 5px;">
                <div class="prog-fill" id="boss-hp" style="width: 100%; background: var(--red);"></div>
            </div>
            <div class="desc" style="text-align:center; margin-top: 8px; font-size: 16px;"><span id="boss-hp-text">10000</span> HP</div>
            <div class="desc" style="text-align:center; margin-top: 8px;">Награда: <span id="boss-reward" style="color: var(--gold); font-size: 18px;">20000$</span></div>
            <div style="font-size: 11px; color: #94a3b8; margin-top: 8px;">Бейте вместе!</div>
        </div>
    </div>
    <div id="rebirth" class="list hidden">
        <div class="card prestige-card" style="border-color: var(--gem);">
            <div style="font-size: 48px;">🌀</div>
            <div class="name" style="color: var(--gem); font-size: 18px;">Перерождение</div>
            <div class="desc" style="white-space: normal;">Сброс прогресса ради кристаллов 💎.<br>+5% к доходу за каждый кристалл навсегда!</div>
            <div style="font-size: 12px; color: #94a3b8;">Нужен: 5 Ур. или 5000$ всего</div>
            <button class="btn btn-rebirth" id="rebirthBtn" onclick="doRebirth()">ПЕРЕРОДИТЬСЯ</button>
        </div>
    </div>
    <div id="top" class="list hidden"></div>

    <script>
        const tg = window.Telegram.WebApp; 
        tg.expand(); tg.ready();
        const uid = tg.initDataUnsafe?.user?.id || 'test';
        const SERVER_URL = ''; // Оставить пустым для Render

        // === КЛИЕНТСКИЙ КЭШ (Мгновенный UI) ===
        let state = {
            balance: 0, clicks: 0, level: 1, passive_income: 0, click_power: 10,
            upgrades: {}, prestige_mult: 1.0, prestige_points: 0, total_prestiges: 0,
            event_data: {}
        };
        let bossState = { hp: 10000, max_hp: 10000, level: 1, name: "Огненный Дракон" };
        let isSyncing = false;

        const $ = id => document.getElementById(id);
        const api = async (path, method='GET', body=null) => {
            try {
                const url = SERVER_URL ? `${SERVER_URL}/api${path}` : `/api${path}`;
                const opts = { method, headers: {'Content-Type':'application/json'} };
                if (body) opts.body = JSON.stringify(body);
                const res = await fetch(url, opts);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (e) {
                console.warn('Sync error:', e);
                return null;
            }
        };

        // === ОПТИМИЗИРОВАННЫЙ РЕНДЕР ===
        function renderUI() {
            const mult = state.prestige_mult || 1.0;
            $('bal').textContent = state.balance.toLocaleString() + '$';
            $('gems').textContent = state.prestige_points || 0;
            $('mult').textContent = mult.toFixed(2);
            $('pwrTxt').textContent = `+${Math.floor((state.click_power||10)*mult)}$/клик`;
            
            const prog = Math.min((state.clicks % 100) / 100 * 100, 100);
            $('lvlFill').style.width = prog + '%';
            $('lvlTxt').textContent = `Уровень ${state.level} (${state.clicks % 100}/100)`;
            
            const rebBtn = $('rebirthBtn');
            if (state.level >= 5 || state.total_earned >= 5000) {
                rebBtn.disabled = false; rebBtn.textContent = "ПЕРЕРОДИТЬСЯ (Сброс)";
            } else {
                rebBtn.disabled = true; rebBtn.textContent = "Недоступно (Нужен 5 Ур.)";
            }
        }

        function renderBoss() {
            $('boss-name').textContent = bossState.name;
            $('boss-lvl').textContent = bossState.level;
            $('boss-hp-text').textContent = Math.floor(bossState.hp).toLocaleString();
            $('boss-reward').textContent = Math.floor(bossState.max_hp * 2).toLocaleString() + '$';
            $('boss-hp').style.width = Math.max(0, (bossState.hp / bossState.max_hp) * 100) + '%';
        }

        // === ФОНОВАЯ СИНХРОНИЗАЦИЯ ===
        async function syncState() {
            if (isSyncing) return;
            isSyncing = true;
            try {
                const data = await api(`/player/${uid}`);
                if (data) {
                    Object.assign(state, data);
                    renderUI();
                }
                const bossData = await api('/boss_status');
                if (bossData) { Object.assign(bossState, bossData); renderBoss(); }
                checkEvent();
            } finally {
                isSyncing = false;
            }
        }

        // === МГНОВЕННЫЙ КЛИК (Оптимистичный) ===
        const btn = $('cBtn');
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e); }, {passive:false});
        btn.addEventListener('mousedown', (e) => { e.preventDefault(); handleTap(e); });

        async function handleTap(e) {
            // 1. Визуальная отдача (0мс)
            btn.classList.add('pressed');
            setTimeout(() => btn.classList.remove('pressed'), 80);
            
            // 2. Хаптик (мгновенно)
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            if (navigator.vibrate) navigator.vibrate(15);

            // 3. Оптимистичное обновление состояния
            const dmg = Math.floor((state.click_power||10) * (state.prestige_mult||1));
            state.balance += dmg;
            state.clicks++;
            state.level = Math.floor(state.clicks / 100) + 1;
            state.total_earned = (state.total_earned||0) + dmg;
            renderUI();

            // 4. Частицы (GPU-ускоренные)
            spawnParticles(e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY, `+${dmg}$`, '#10b981');

            // 5. Тряска при мощном клике
            if (dmg > 1000) { document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'), 400); }

            // 6. Фоновая отправка на сервер (не блокирует UI)
            api(`/click/${uid}`, 'POST').then(res => {
                if (res && !res.error) {
                    if (res.boss_dmg) {
                        bossState.hp = Math.max(0, bossState.hp - res.boss_dmg);
                        renderBoss();
                        if (res.boss_killed) {
                            state.balance += res.boss_killed.reward;
                            tg.showAlert(` Босс повержен! +${res.boss_killed.reward}$`);
                            for(let i=0;i<12;i++) setTimeout(()=>spawnParticles(Math.random()*innerWidth, Math.random()*innerHeight, '', '#f59e0b'), i*60);
                        }
                    }
                    // Тихая синхронизация (исправляет дрифт, если был)
                    Object.assign(state, res);
                    renderUI();
                }
            });
        }

        // === GPU-ЧАСТИЦЫ ===
        const canvas = $('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
        window.addEventListener('resize', resize); resize();

        function spawnParticles(x, y, text, color) {
            for (let i=0; i<6; i++) {
                particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10-4, life:1, color, text: i===0?text:null, size: i===0?20: Math.random()*4+2 });
            }
        }
        function loop() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for (let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life -= 0.04;
                ctx.globalAlpha = p.life;
                if (p.text) {
                    ctx.fillStyle=p.color; ctx.font=`bold ${p.size}px sans-serif`; ctx.strokeStyle='black'; ctx.lineWidth=2;
                    ctx.strokeText(p.text, p.x, p.y); ctx.fillText(p.text, p.x, p.y);
                } else {
                    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                }
                ctx.globalAlpha=1;
                if(p.life<=0) particles.splice(i,1);
            }
            requestAnimationFrame(loop);
        }
        loop();

        // === ВКЛАДКИ И МАГАЗИН ===
        let currentTab = 'upgrades';
        function switchTab(name, el) {
            currentTab = name;
            document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.list').forEach(l=>l.classList.add('hidden'));
            $(name).classList.remove('hidden');
            if(name==='upgrades') renderShop();
            if(name==='achievements') renderAchievements();
            if(name==='top') renderTop();
        }

        async function renderShop() {
            const shop = await api('/shop');
            if(!shop) return;
            let h='';
            for(const [k,v] of Object.entries(shop)) {
                const cnt = (state.upgrades||{})[k]||0;
                const price = Math.floor(v.cost * Math.pow(1.15, cnt));
                const type = v.type==='click' ? `+${v.power} клик` : `+${v.income}/сек`;
                h += `<div class="card"><div class="card-left"><div class="icon">${v.icon||'📦'}</div><div style="min-width:0"><div class="name">${v.name}</div><div class="desc">${type} | ${cnt} шт.</div></div></div><button class="btn btn-buy" onclick="buy('${k}',${price})" ${state.balance<price?'disabled':''}>${price}$</button></div>`;
            }
            $('upgrades').innerHTML = h;
        }

        async function buy(id, price) {
            if(state.balance < price) return;
            // Оптимистично списываем
            state.balance -= price;
            renderUI();
            
            const res = await api(`/buy/${uid}/${id}`, 'POST');
            if(res && res.success) {
                Object.assign(state, res);
                renderUI(); renderShop();
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                // Откат при ошибке
                state.balance += price;
                renderUI();
                if(res) tg.showAlert(res.error);
            }
        }

        async function renderAchievements() {
            const achs = await api('/achievements');
            if(!achs) return;
            let h='';
            const cols = {common:'#94a3b8', uncommon:'#10b981', rare:'#3b82f6', epic:'#8b5cf6', legendary:'#f59e0b'};
            achs.forEach(a => {
                h += `<div class="card" style="border-color:${cols[a.rarity]}; flex-direction:column; gap:8px;">
                    <div class="card-left"><div class="icon" style="background:${cols[a.rarity]}20;color:${cols[a.rarity]};">🏆</div>
                    <div style="min-width:0;flex:1;"><div class="name" style="color:${cols[a.rarity]};">${a.name}</div>
                    <div class="desc">${a.desc}</div>
                    <div class="prog-wrap"><div class="prog-fill" style="width:0%;background:${cols[a.rarity]};"></div></div>
                    <div class="desc" style="margin-top:4px;">Награда: ${a.reward}$</div></div></div>
                </div>`;
            });
            $('achievements').innerHTML = h;
        }

        async function doRebirth() {
            tg.showConfirm("Сброс прогресса ради кристаллов?", async ok => {
                if(!ok) return;
                const res = await api(`/rebirth/${uid}`, 'POST');
                if(res && res.success) {
                    tg.showAlert(res.message);
                    state = { balance:0, clicks:0, level:1, passive_income:0, click_power:10, upgrades:{}, prestige_mult:1, prestige_points:0, total_prestiges:0, event_data:{} };
                    await syncState();
                    switchTab('upgrades', document.querySelector('.tab'));
                } else if(res) tg.showAlert(res.error);
            });
        }

        async function renderTop() {
            const top = await api('/leaderboard');
            if(!top) return;
            $('top').innerHTML = top.length ? top.map((p,i)=>`<div class="card" style="${p.chat_id==uid?'border:1px solid var(--accent)':''}"><div class="card-left"><div class="icon" style="background:${i<3?'var(--gold)':'#334155'};color:${i<3?'#000':'#fff'}">#${p.rank}</div><div class="name">Игрок #${p.chat_id}</div></div><div style="font-weight:700;color:var(--green)">${p.balance}$</div></div>`).join('') : '<div style="text-align:center;padding:20px;color:#64748b">Пока пусто</div>';
        }

        async function checkEvent() {
            const ev = await api(`/events/status/${uid}`);
            const banner = $('eventBanner');
            if(ev && ev.active) {
                banner.style.display='block';
                banner.style.backgroundColor=ev.event.color+'20';
                banner.style.borderColor=ev.event.color;
                banner.innerHTML=`<div style="font-size:14px;">${ev.event.name}</div><div>${ev.event.desc} | ${ev.remaining}с</div>`;
                setTimeout(checkEvent, 1000);
            } else banner.style.display='none';
        }

        // === ЗАПУСК ===
        syncState();
        setInterval(()=>{
            if(state.passive_income > 0) {
                const add = Math.floor(state.passive_income * (state.prestige_mult||1));
                state.balance += add;
                state.total_earned = (state.total_earned||0) + add;
                renderUI();
            }
        }, 1000);
    </script>
</body>
</html>
